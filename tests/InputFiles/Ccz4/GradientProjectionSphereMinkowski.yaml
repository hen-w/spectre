# Second-order CCZ4 with the DG upwind gradient-projection scheme on one
# radial layer of six excised wedges, with analytic Minkowski data on the inner
# and outer boundaries. Only the options are checked.

Executable: EvolveCcz4
Testing:
  Check: parse
  Priority: High

---

Parallelization:
  ElementDistribution: NumGridPoints

ResourceInfo:
  AvoidGlobalProc0: false

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.01
  MinimumTimeStep: 1e-7
  TimeStepper:
    AdamsBashforth:
      Order: 3

PhaseChangeAndTriggers: []

EvolutionSystem:
  Ccz4:
    EtaConstant: 0.0
    Kappa1:
      GaussianPlusConstant:
        Constant: 0.001
        Amplitude: 0.0
        Width: 1.0
        Center: [0.0, 0.0, 0.0]
    Kappa2:
      GaussianPlusConstant:
        Constant: 0.0
        Amplitude: 0.0
        Width: 1.0
        Center: [0.0, 0.0, 0.0]
    Kappa3: 0.5

InitialData: &InitialData
  Ccz4(Minkowski):

RandomizeInitialData: None

PerturbInitialData: None

DomainCreator:
  Sphere:
    InnerRadius: 2.0
    OuterRadius: 4.0
    Interior:
      ExciseWithBoundaryCondition:
        DirichletAnalytic:
          AnalyticPrescription: *InitialData
    InitialRefinement: 0
    InitialGridPoints: 5
    UseEquiangularMap: true
    EquatorialCompression: None
    RadialPartitioning: []
    RadialDistribution: [Linear]
    WhichWedges: All
    TimeDependentMaps: None
    OuterBoundaryCondition:
      DirichletAnalytic:
        AnalyticPrescription: *InitialData

SpatialDiscretization:
  BoundaryCorrection:
    UpwindGradientProjection:
      ExternalDissipationFactor: 1.0
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    # The only runtime filter offered: the scheme's own top-shell filter is
    # applied by its step actions and has no options.
    Filtering:
      - None:
          BlocksToFilter: All

EventsAndTriggersAtCheckpoints:

EventsAndTriggersAtSlabs:
  - Trigger:
      Slabs:
        Specified:
          Values: [10]
    Events:
      - Completion

EventsAndDenseTriggers:
  - Trigger:
      Times:
        EvenlySpaced:
          Interval: 0.05
          Offset: 0.0
    Events:
      - ObserveTimeStep:
          SubfileName: TimeSteps
          PrintTimeToTerminal: True
          ObservePerCore: False
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve:
            - Conformal(SpatialMetric)
            - ConformalFactor
            - ATilde
            - TraceExtrinsicCurvature
            - Theta
            - GammaHat
            - Lapse
            - Shift
            - AuxiliaryShiftB
          InterpolateToMesh: None
          ProjectToMesh: None
          CoordinatesFloatingPointType: Double
          FloatingPointTypes: [Double]
          BlocksToObserve: All
      - ObserveNorms:
          SubfileName: Norms
          TensorsToObserve:
            - Name: Error(Conformal(SpatialMetric))
              NormType: L2Norm
              Components: Sum
            - Name: Theta
              NormType: Max
              Components: Sum

EventsRunAtCleanup:
  ObservationValue: -1000.0
  Events:

Observers:
  VolumeFileName: "Ccz4GradientProjectionVolume"
  ReductionFileName: "Ccz4GradientProjectionReductions"
